<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Aim Trainer</title>
<meta name="theme-color" content="#07080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--t:#f3f4fb;--d:#8d92b3;--l:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{height:100%;background:#07080f;color:var(--t);overflow:hidden;font-family:-apple-system,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 22px);background:linear-gradient(rgba(8,10,22,.3),rgba(8,10,22,.72));transition:opacity .3s}
.scr.off{opacity:0;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand span{font-weight:300;color:var(--d)}
.top button{color:var(--d);font-size:14px;padding:8px 0 8px 16px}
.top button.off{opacity:.35}
.scroll{flex:1;overflow-y:auto;touch-action:none;margin:14px -22px 12px;padding:0 22px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:rgba(255,255,255,.045);border:1px solid var(--l);transition:background .2s,border-color .2s,box-shadow .2s;flex-shrink:0}
.card.on{border-color:rgb(var(--c));background:rgba(var(--c),.12);box-shadow:0 0 28px rgba(var(--c),.22)}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(var(--c),.16);color:rgb(var(--c));flex-shrink:0}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:17px;font-weight:600}
.tx small{display:block;font-size:13px;color:var(--d);line-height:1.3;margin-top:2px}
.bs{font-size:13px;font-weight:600;color:rgb(var(--c));white-space:nowrap}
.lb{font-size:13px;color:var(--d);margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.seg button{padding:13px 4px;border-radius:14px;border:1px solid var(--l);background:rgba(255,255,255,.04);font-weight:500;transition:all .15s}
.seg button.on{background:rgba(var(--ac,255,255,255),.2);color:#fff;border-color:rgba(var(--ac,255,255,255),.55);box-shadow:inset 0 0 14px rgba(var(--ac,255,255,255),.12)}
.play{width:100%;padding:19px;border-radius:18px;color:#0b0d1a;font-size:18px;font-weight:700;transition:transform .1s}
.play:active{transform:scale(.97)}
.ghost{width:100%;padding:14px;color:var(--d);font-weight:500}
.hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 16px) 22px 0;display:flex;justify-content:space-between;pointer-events:none;transition:opacity .25s}
.hud.off{opacity:0}
.hud div{display:flex;flex-direction:column;min-width:70px}
.hud .m{align-items:center}.hud .e{align-items:flex-end}
.hud small{font-size:12px;color:var(--d)}
.hud b{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}
#bar{position:fixed;top:0;left:0;right:0;height:3px;transform-origin:left;transform:scaleX(0)}
#hx{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;margin:auto;width:max-content;color:var(--d);font-size:14px;padding:8px 16px;opacity:.7;display:none}
.res{align-items:stretch;justify-content:space-between}
.ctr{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.rk{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:700;border:2px solid rgb(var(--c));color:rgb(var(--c));box-shadow:0 0 30px rgba(var(--c),.4),inset 0 0 20px rgba(var(--c),.15);animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.big{font-size:92px;font-weight:200;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.rec{font-size:15px;font-weight:600;color:rgb(var(--c));min-height:1.4em}
.rows{background:rgba(255,255,255,.05);border:1px solid var(--l);border-radius:20px;padding:2px 18px;margin-top:10px}
.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--l);font-size:15px}
.row:last-child{border:0}
.row span:first-child{color:var(--d)}
.row span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.bot{display:flex;flex-direction:column;gap:4px}
#app{position:fixed;left:0;top:0;overflow:hidden}
.res>div{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.rl1{align-items:center;text-align:center}
.ls .scr{padding:14px 22px}
.ls #menu{display:grid;grid-template-columns:minmax(230px,36%) 1fr;grid-template-rows:auto 1fr;column-gap:22px}
.ls #menu .top{grid-area:1/1}
.ls #menu .scroll{grid-area:1/2/3/3;margin:0 -22px 0 0;padding:0 22px 0 0;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:10px;min-height:0}
.ls #menu .bot{grid-area:2/1;justify-content:flex-end}
.ls .card{padding:11px;gap:11px}
.ls .tx small{font-size:12px}
.ls .seg{margin-bottom:10px}
.ls .play{padding:15px}
.ls .hud{padding:12px 22px 0}
.ls .hud b{font-size:22px}
.ls .res{flex-direction:row;gap:26px}
.ls .rr{overflow-y:auto;touch-action:none;scrollbar-width:none;justify-content:flex-start}
.ls .rows{margin-top:0}
.ls .row{padding:9px 0;font-size:14px}
.ls .rk{width:54px;height:54px;font-size:26px}
.ls .big{font-size:68px}
.ls .res .bot{flex-direction:row;align-items:center}
.ls .res .play{padding:14px}
.ls .res .ghost{width:auto;flex:0 0 auto;padding:14px 12px}
.ls #hx{bottom:6px}
#hx button{padding:8px 14px;color:var(--d);font-size:14px}
.blk{background:rgba(255,255,255,.05);border:1px solid var(--l);border-radius:18px;padding:14px;flex-shrink:0}
.blk .seg{margin-bottom:0}.blk .seg button{font-size:13px;padding:11px 2px}
.xb{height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.xb i{display:block;height:100%;background:var(--t)}
.hm{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.hm i{aspect-ratio:1.6;border-radius:6px}
.ls .two{display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:10px}
.trk{position:absolute;right:0;width:26px;display:none;z-index:6}
.trk i{position:absolute;right:7px;width:6px;border-radius:3px;background:rgba(255,255,255,.4)}
input{font:inherit;color:var(--t);background:rgba(255,255,255,.07);border:1px solid var(--l);border-radius:12px;padding:12px;width:100%;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.lr{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--l);font-size:14px}
.lr span:first-child{color:var(--d);width:24px}.lr span:nth-child(2){flex:1}.lr.me{font-weight:700}
.sec{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--d);margin:8px 2px 0}
.swg{gap:6px}.swg button{height:30px;padding:0;border:0;border-radius:50%}.swg button.on{box-shadow:0 0 0 2px #fff}
.hero{display:flex;gap:16px;align-items:center}.ring{width:96px;height:96px;flex-shrink:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:rgba(255,255,255,.05);border-radius:14px;padding:10px 12px}.tile b{display:block;font-size:22px;font-weight:600}.tile small{color:var(--d);font-size:12px}
.ach{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--l);opacity:.45}.ach.on{opacity:1}
.ach i{width:10px;height:10px;border-radius:50%;background:var(--d);flex-shrink:0;margin-top:5px}.ach.on i{background:#7ae582;box-shadow:0 0 8px #7ae582}
.ach b{display:block;font-size:14px}.ach small{font-size:12px;color:var(--d)}
.rt{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px 8px;font-size:13px}.rt span{color:var(--d)}.rt span:nth-child(4n+1){color:var(--t)}
.lr span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div id="bar"></div>

<div class="hud off" id="hud">
  <div><small>Очки</small><b id="hs">0</b></div>
  <div class="m"><small id="hl">Время</small><b id="ht">30.0</b></div>
  <div class="e"><small id="hr">Комбо</small><b id="hc">x0</b></div>
</div>
<div id="hx"><button id="pz">Пауза</button><button id="xx">Выйти</button></div>

<div class="scr" id="menu">
  <div class="top"><div class="brand">AIM<span> Trainer</span></div><div><button id="rb">Рейтинг</button><button id="pb">Профиль</button><button id="ob">Настройки</button></div></div>
  <div class="scroll" id="cards"></div>
  <div class="bot">
    <div class="lb">Раздел</div>
    <div class="seg" id="cs" style="grid-template-columns:1fr 1fr"></div>

    <div class="seg" id="sd"></div>
    <button class="play" id="go">Играть</button>
  </div>
</div>

<div class="scr res off" id="res">
  <div class="rl1"><div class="top"><span id="rt" style="color:var(--d)"></span></div>
  <div class="ctr">
    <div class="rk" id="rk">S</div>
    <div class="big" id="rs">0</div>
    <div style="color:var(--d);font-size:15px" id="rl"></div>
    <div class="rec" id="nb">Новый рекорд</div>
    </div></div>
  <div class="rr"><div class="rows" id="rg"></div>
  <div class="bot">
    <button class="play" id="again">Ещё раз</button>
    <button class="ghost" id="tomenu">В меню</button>
  </div></div>
</div>

<div class="scr off" id="set"><div class="top"><div class="brand">Настройки</div><button id="sc">Готово</button></div><div class="scroll two" id="sbody"></div></div>
<div class="scr off" id="prof"><div class="top"><div class="brand">Профиль</div><button id="pc">Закрыть</button></div><div class="scroll two" id="pbody"></div></div>
<div class="scr off" id="rat"><div class="top"><div class="brand" id="rbrand">Рейтинг</div><button id="rc">Готово</button></div><div class="scroll two" id="rbody"></div></div>
<div class="scr off" id="tips"><div class="top"><div class="brand">Советы по прицелу</div><button id="tc">Готово</button></div><div class="scroll two" id="tbody"></div></div>
<div class="scr off" id="pau" style="align-items:center;justify-content:center;gap:10px;background:rgba(8,10,22,.82)"><div class="brand" style="margin-bottom:10px">Пауза</div><button class="play" id="rsm" style="max-width:300px;background:var(--t)">Продолжить</button><button class="ghost" id="qq" style="max-width:300px">Выйти в меню</button></div>
</div>

function manHit(t,x,y,now){
  var m=mpos(t,now),s=t.s;
  if(m.v<.5)return 0;
  if(t.kind==='peek'&&Math.abs(x-t.x)<t.s*.5&&y>t.y-t.s*1.2&&y<t.y+t.s*.7)return 0;
  if(Math.hypot(x-m.x,y-(m.y-s*.9))<=s*.24*1.35+4)return 'h';
  if(Math.abs(x-m.x)<=s*.38*1.15&&y>=m.y-s*.62-4&&y<=m.y+s*.68+4)return 'b';
  return 0;
}
function man(t,now,c){
  var m=mpos(t,now),s=t.s,x=m.x,y=m.y;
  ctx.save();ctx.fillStyle='#20263f';ctx.strokeStyle='rgb('+c+')';ctx.lineWidth=2;
  ctx.beginPath();ctx.rect(x-s*.38,y-s*.62,s*.76,s*1.3);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(x,y-s*.9,s*.24,0,6.283);ctx.fillStyle='#2c3354';ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba('+c+',.9)';ctx.beginPath();ctx.arc(x,y-s*.9,s*.07,0,6.283);ctx.fill();

  ctx.restore();
}

function mkScroll(el){
  var scr=el.parentNode,tk=document.createElement('div'),th=document.createElement('i');
  tk.className='trk';tk.appendChild(th);scr.appendChild(tk);

  tk.addEventListener('pointerup',function(){td=false});tk.addEventListener('pointercancel',function(){td=false});
  upd();
}
